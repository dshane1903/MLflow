name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev,spark]'
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: |
          mle101 generate
          mle101 train
          mle101 promote
          mle101 export-model
      - run: docker build -t mle101-claims:ci .
      - run: |
          docker run --detach --name mle101-api --publish 8000:8000 \
            --volume "$PWD/artifacts/container-model:/model:ro" \
            --env MLE101_MODEL_URI=/model mle101-claims:ci
          curl --fail-with-body --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8000/health
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"initial_estimate":9000,"deductible":1000,"policy_tenure_months":12,"prior_claims":1,"reported_delay_days":4,"incident_type":"fire","region":"south"}' \
            http://127.0.0.1:8000/predict

